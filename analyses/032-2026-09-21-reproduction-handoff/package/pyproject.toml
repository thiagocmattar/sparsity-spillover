[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activation-sparsity-codesign"
version = "0.2.0"
description = "Supplement to Activation Sparsity as Training-Inference Co-Design"
requires-python = ">=3.11,<3.13"
dependencies = ["torch==2.11.0", "transformers==5.12.1", "numpy==2.5.0", "safetensors==0.8.0", "pyyaml==6.0.2", "matplotlib>=3.11,<3.12", "datasets>=5.0,<5.1"]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-p no:cacheprovider --basetemp=.pytest_tmp"
