[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsity-research"
version = "0.1.0"
description = "Lean primitives for guided activation-sparsity experiments."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "datasets>=5.0,<5.1",
  "matplotlib>=3.11,<3.12",
  "numpy>=2.5,<2.6",
  "pyyaml>=6.0,<7",
  "safetensors>=0.8,<0.9",
  "torch>=2.11,<2.12",
  "transformers>=5.12,<5.13",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --basetemp=.pytest_tmp"
pythonpath = ["src", "."]
